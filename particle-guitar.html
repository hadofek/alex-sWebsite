<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlexGuitar — Particle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Spectral:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: auto; }

    body {
      background: oklch(12% 0.008 65);
      overflow-x: hidden;
    }

    #scroll-container {
      height: 500vh;
    }

    #sticky-scene {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* Phase labels */
    .phase-label {
      position: absolute;
      bottom: 60px;
      left: 48px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(0.9rem, 1.8vw, 1.2rem);
      letter-spacing: 0.22em;
      color: oklch(68% 0.12 75);
      opacity: 0;
      pointer-events: none;
    }

    #label-a { opacity: 1; }

    /* Sub-label (italic Spectral) */
    .phase-sub {
      position: absolute;
      bottom: 44px;
      left: 50px;
      font-family: 'Spectral', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(0.7rem, 1.2vw, 0.85rem);
      letter-spacing: 0.04em;
      color: oklch(62% 0.012 70);
      opacity: 0;
      pointer-events: none;
    }

    #sub-a { opacity: 0.7; }

    /* Scroll hint */
    .scroll-hint {
      position: absolute;
      bottom: 44px;
      right: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: oklch(62% 0.012 70);
      font-family: 'Spectral', Georgia, serif;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    .scroll-line {
      width: 1px;
      height: 44px;
      background: linear-gradient(to bottom, oklch(68% 0.12 75), transparent);
      animation: scrollPulse 2.4s ease-out infinite;
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: 0.3; transform: scaleY(1); }
      50%       { opacity: 0.9; transform: scaleY(1.08); }
    }

    /* Back link */
    .back-link {
      position: fixed;
      top: 28px;
      left: 40px;
      font-family: 'Spectral', Georgia, serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: oklch(62% 0.012 70);
      text-decoration: none;
      z-index: 10;
      transition: color 0.2s;
    }

    .back-link:hover { color: oklch(91% 0.015 75); }

    @media (prefers-reduced-motion: reduce) {
      .scroll-line { animation: none; opacity: 0.4; }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">← AlexGuitar</a>

  <div id="scroll-container">
    <div id="sticky-scene">
      <canvas id="particle-canvas"></canvas>

      <span class="phase-label" id="label-a">Electric Guitar</span>
      <span class="phase-label" id="label-b">New Angle</span>
      <span class="phase-label" id="label-c">Dissolving</span>
      <span class="phase-label" id="label-d">Find Your Sound</span>

      <span class="phase-sub" id="sub-a">Particle cloud — 4 000 points</span>
      <span class="phase-sub" id="sub-d">Write to Alex and begin.</span>

      <div class="scroll-hint">
        <span>Scroll</span>
        <div class="scroll-line"></div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    gsap.registerPlugin(ScrollTrigger);

    // ─────────────────────────────────────────
    //  CONFIG
    // ─────────────────────────────────────────
    const N      = 4000;          // particle count
    const SCALE  = 2.4;           // guitar size in 3D units
    const AMBER  = 0xc8922a;
    const BG     = 0x1a150a;

    // ─────────────────────────────────────────
    //  GUITAR SHAPE → POSITIONS
    //  Draw the guitar silhouette on an offscreen
    //  canvas, sample filled pixels as 3D coords.
    // ─────────────────────────────────────────
    function buildGuitarPositions(count) {
      const CW = 300, CH = 600;
      const off = document.createElement('canvas');
      off.width = CW; off.height = CH;
      const ctx = off.getContext('2d');
      const cx = CW / 2;

      ctx.fillStyle = 'white';

      // Headstock
      ctx.fillRect(cx - CW*0.15, CH*0.010, CW*0.30, CH*0.052);

      // Neck (slight taper toward body)
      ctx.beginPath();
      ctx.moveTo(cx - CW*0.060, CH*0.062);
      ctx.lineTo(cx + CW*0.060, CH*0.062);
      ctx.lineTo(cx + CW*0.080, CH*0.430);
      ctx.lineTo(cx - CW*0.080, CH*0.430);
      ctx.closePath();
      ctx.fill();

      // Upper bout
      ctx.beginPath();
      ctx.ellipse(cx, CH*0.540, CW*0.270, CH*0.112, 0, 0, Math.PI*2);
      ctx.fill();

      // Waist bridge (connects upper + lower bout)
      ctx.fillRect(cx - CW*0.188, CH*0.638, CW*0.376, CH*0.078);

      // Lower bout (larger)
      ctx.beginPath();
      ctx.ellipse(cx, CH*0.796, CW*0.368, CH*0.178, 0, 0, Math.PI*2);
      ctx.fill();

      // Collect non-transparent pixel coordinates
      const { data } = ctx.getImageData(0, 0, CW, CH);
      const pool = [];
      for (let y = 0; y < CH; y++) {
        for (let x = 0; x < CW; x++) {
          if (data[(y * CW + x) * 4 + 3] > 128) pool.push(x, y);
        }
      }

      // Sample from pool, convert to 3D coords
      const ASPECT = CH / CW; // 2.0
      const out = new Float32Array(count * 3);
      const poolLen = pool.length / 2;
      for (let i = 0; i < count; i++) {
        const p = Math.floor(Math.random() * poolLen) * 2;
        out[i*3]   =  ((pool[p]   / CW) - 0.5) * SCALE;
        out[i*3+1] = -((pool[p+1] / CH) - 0.5) * SCALE * ASPECT;
        out[i*3+2] =  (Math.random() - 0.5) * 0.12; // thin depth
      }
      return out;
    }

    // Rotate an entire position array by Euler angles
    function rotate(src, rx, ry, rz) {
      const mat = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rx, ry, rz));
      const out = new Float32Array(src.length);
      const v   = new THREE.Vector3();
      for (let i = 0; i < src.length; i += 3) {
        v.set(src[i], src[i+1], src[i+2]).applyMatrix4(mat);
        out[i] = v.x; out[i+1] = v.y; out[i+2] = v.z;
      }
      return out;
    }

    // Scatter positions in a sphere
    function scatter(count, radius) {
      const out = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi   = Math.acos(2 * Math.random() - 1);
        const r     = radius * (0.35 + Math.random() * 0.65);
        out[i*3]   = r * Math.sin(phi) * Math.cos(theta);
        out[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
        out[i*3+2] = r * Math.cos(phi);
      }
      return out;
    }

    // Lerp two position arrays into a destination
    function lerp3(a, b, dst, t) {
      const u = 1 - t;
      for (let i = 0; i < dst.length; i++) dst[i] = a[i] * u + b[i] * t;
    }

    function smoothstep(t) {
      t = Math.max(0, Math.min(1, t));
      return t * t * (3 - 2 * t);
    }

    // ─────────────────────────────────────────
    //  POSITION STATES
    // ─────────────────────────────────────────
    const stateA = buildGuitarPositions(N);
    const stateB = rotate(stateA, 0.08,  0.85,  0.04);          // 3/4 perspective
    const stateC = scatter(N, 5.0);                              // dissolved cloud
    const stateD = rotate(stateA, 0.38, -0.65,  0.0);           // different angle

    // ─────────────────────────────────────────
    //  GLOW TEXTURE (radial gradient on canvas)
    // ─────────────────────────────────────────
    function glowTexture() {
      const S   = 64;
      const off = document.createElement('canvas');
      off.width = S; off.height = S;
      const ctx = off.getContext('2d');
      const g   = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
      g.addColorStop(0,    'rgba(255, 248, 220, 1.00)');
      g.addColorStop(0.20, 'rgba(240, 190,  90, 0.85)');
      g.addColorStop(0.55, 'rgba(200, 146,  42, 0.35)');
      g.addColorStop(1,    'rgba(160,  80,  20, 0.00)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, S, S);
      return new THREE.CanvasTexture(off);
    }

    // ─────────────────────────────────────────
    //  THREE.JS SETUP
    // ─────────────────────────────────────────
    const canvas   = document.getElementById('particle-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(BG, 1);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 100);
    camera.position.z = 5;

    // Geometry — live position attribute updated every frame
    const geometry = new THREE.BufferGeometry();
    const posAttr  = new THREE.BufferAttribute(new Float32Array(stateA), 3);
    posAttr.setUsage(THREE.DynamicDrawUsage);
    geometry.setAttribute('position', posAttr);

    const material = new THREE.PointsMaterial({
      size:            0.055,
      map:             glowTexture(),
      color:           new THREE.Color(AMBER),
      transparent:     true,
      depthWrite:      false,
      blending:        THREE.AdditiveBlending,
      sizeAttenuation: true,
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    // ─────────────────────────────────────────
    //  RESIZE
    // ─────────────────────────────────────────
    function onResize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    onResize();
    window.addEventListener('resize', onResize);

    // ─────────────────────────────────────────
    //  WIGGLE — organic particle breathing
    //  Each particle has a random phase offset
    //  so they oscillate independently.
    // ─────────────────────────────────────────
    const wigglePhase = new Float32Array(N);
    for (let i = 0; i < N; i++) wigglePhase[i] = Math.random() * Math.PI * 2;

    // Base positions — updated by GSAP lerp, then
    // wiggle is added on top in the render loop.
    const basePos = new Float32Array(stateA);

    // ─────────────────────────────────────────
    //  SCROLL ANIMATION
    //
    //  phase 0-1: hold at stateA (guitar, front)
    //  phase 1-2: lerp stateA → stateB (rotate)
    //  phase 2-3: lerp stateB → stateC (scatter)
    //  phase 3-4: lerp stateC → stateD (reform)
    // ─────────────────────────────────────────
    const proxy = { phase: 0 };

    function updateBase() {
      const p = proxy.phase;
      if (p <= 1) {
        basePos.set(stateA);
      } else if (p <= 2) {
        lerp3(stateA, stateB, basePos, smoothstep(p - 1));
      } else if (p <= 3) {
        lerp3(stateB, stateC, basePos, smoothstep(p - 2));
      } else {
        lerp3(stateC, stateD, basePos, smoothstep(Math.min(p - 3, 1)));
      }
    }

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: '#scroll-container',
        start:   'top top',
        end:     'bottom bottom',
        scrub:   2.5,
      },
      onUpdate: updateBase,
    });

    tl.to(proxy, { phase: 1, duration: 1,   ease: 'none'          }); // 0–25%  hold
    tl.to(proxy, { phase: 2, duration: 1.5, ease: 'power2.inOut'  }); // 25–62% rotate
    tl.to(proxy, { phase: 3, duration: 1,   ease: 'power1.in'     }); // 62–87% scatter
    tl.to(proxy, { phase: 4, duration: 0.5, ease: 'power2.out'    }); // 87–100% reform

    // ─────────────────────────────────────────
    //  PHASE LABELS
    // ─────────────────────────────────────────
    gsap.timeline({
      scrollTrigger: {
        trigger: '#scroll-container',
        start:   'top top',
        end:     'bottom bottom',
        scrub:   1,
      }
    })
    .to('#label-a', { opacity: 0, duration: 0.06 }, 0.10)
    .to('#sub-a',   { opacity: 0, duration: 0.06 }, 0.10)
    .to('#label-b', { opacity: 1, duration: 0.06 }, 0.28)
    .to('#label-b', { opacity: 0, duration: 0.06 }, 0.46)
    .to('#label-c', { opacity: 1, duration: 0.06 }, 0.52)
    .to('#label-c', { opacity: 0, duration: 0.06 }, 0.68)
    .to('#label-d', { opacity: 1, duration: 0.10 }, 0.82)
    .to('#sub-d',   { opacity: 0.7, duration: 0.10 }, 0.88);

    // ─────────────────────────────────────────
    //  RENDER LOOP
    // ─────────────────────────────────────────
    let clock = 0;

    (function animate() {
      requestAnimationFrame(animate);
      clock += 0.004;

      // Wiggle amplitude scales with scatter phase (particles
      // are more agitated while dissolving).
      const p = proxy.phase;
      const wiggleAmt = p > 2 && p < 3
        ? 0.006 + smoothstep(p - 2) * 0.022   // agitated during scatter
        : 0.006;                                // subtle breathing otherwise

      // Write basePos + wiggle into the live attribute
      const pos = posAttr.array;
      for (let i = 0; i < N; i++) {
        const w = Math.sin(clock * 1.8 + wigglePhase[i]) * wiggleAmt;
        pos[i*3]   = basePos[i*3]   + w;
        pos[i*3+1] = basePos[i*3+1] + w * 0.6;
        pos[i*3+2] = basePos[i*3+2] + w * 0.4;
      }
      posAttr.needsUpdate = true;

      renderer.render(scene, camera);
    })();

  </script>
</body>
</html>
