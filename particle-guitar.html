<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlexGuitar — Particle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Spectral:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: auto; }

    body {
      background: oklch(12% 0.008 65);
    }

    /* overflow-x on body breaks position:sticky on iOS Safari —
       use a wrapper div instead */
    #clip-wrap {
      overflow-x: hidden;
    }

    #scroll-container { height: 500vh; }

    #sticky-scene {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* Phase labels */
    .phase-label {
      position: absolute;
      bottom: 60px;
      left: 48px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(0.9rem, 1.8vw, 1.2rem);
      letter-spacing: 0.22em;
      color: oklch(68% 0.12 75);
      opacity: 0;
      pointer-events: none;
    }
    #label-a { opacity: 1; }

    .phase-sub {
      position: absolute;
      bottom: 44px;
      left: 50px;
      font-family: 'Spectral', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(0.7rem, 1.2vw, 0.85rem);
      letter-spacing: 0.04em;
      color: oklch(62% 0.012 70);
      opacity: 0;
      pointer-events: none;
    }
    #sub-a { opacity: 0.7; }

    /* Scroll hint */
    .scroll-hint {
      position: absolute;
      bottom: 44px;
      right: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: oklch(62% 0.012 70);
      font-family: 'Spectral', Georgia, serif;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.55;
    }
    .scroll-line {
      width: 1px;
      height: 44px;
      background: linear-gradient(to bottom, oklch(68% 0.12 75), transparent);
      animation: scrollPulse 2.4s ease-out infinite;
    }
    @keyframes scrollPulse {
      0%, 100% { opacity: 0.3; transform: scaleY(1); }
      50%       { opacity: 0.9; transform: scaleY(1.08); }
    }

    /* Back link */
    .back-link {
      position: fixed;
      top: 28px;
      left: 40px;
      font-family: 'Spectral', Georgia, serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: oklch(62% 0.012 70);
      text-decoration: none;
      z-index: 10;
      transition: color 0.2s;
    }
    .back-link:hover { color: oklch(91% 0.015 75); }

    @media (prefers-reduced-motion: reduce) {
      .scroll-line { animation: none; opacity: 0.4; }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">← AlexGuitar</a>

  <div id="clip-wrap">
  <div id="scroll-container">
    <div id="sticky-scene">
      <canvas id="particle-canvas"></canvas>

      <span class="phase-label" id="label-a">6 Strings</span>
      <span class="phase-label" id="label-b">The Bridge</span>
      <span class="phase-label" id="label-c">In Motion</span>
      <span class="phase-label" id="label-d">Find Your Sound</span>

      <span class="phase-sub" id="sub-a">8 000 particles</span>
      <span class="phase-sub" id="sub-d">Write to Alex and begin.</span>

      <div class="scroll-hint">
        <span>Scroll</span>
        <div class="scroll-line"></div>
      </div>
    </div>
  </div>

  </div><!-- /clip-wrap -->

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script>
    const THREE = window.THREE;

    gsap.registerPlugin(ScrollTrigger);

    // ─────────────────────────────────────────
    //  CONFIG
    // ─────────────────────────────────────────
    const N         = 8000;
    const N_GUITAR  = 6400;
    const N_AMBIENT = 1600;
    const AMBER = 0xc8922a;
    const BG    = 0x1a150a;

    // ─────────────────────────────────────────
    //  GC-FREE ROTATION HELPERS
    // ─────────────────────────────────────────
    const _mat   = new THREE.Matrix4();
    const _euler = new THREE.Euler();
    const _rv    = new THREE.Vector3();

    function rotateInto(src, rx, ry, rz, dst) {
      _euler.set(rx, ry, rz);
      _mat.makeRotationFromEuler(_euler);
      for (let i = 0; i < src.length; i += 3) {
        _rv.set(src[i], src[i+1], src[i+2]).applyMatrix4(_mat);
        dst[i] = _rv.x; dst[i+1] = _rv.y; dst[i+2] = _rv.z;
      }
    }

    function rotate(src, rx, ry, rz) {
      const out = new Float32Array(src.length);
      rotateInto(src, rx, ry, rz, out);
      return out;
    }

    // ─────────────────────────────────────────
    //  GUITAR POSITIONS — image pixel sampling
    // ─────────────────────────────────────────
    async function buildGuitarPositions(count) {
      const CW = 400, CH = 800;
      const cx = CW / 2;
      let bodyPool  = null;
      let cx_canvas = CW / 2;
      let cy_canvas = CH / 2;
      let worldScale = 5.5 / Math.max(CW, CH);

      try {
        const img = await new Promise((res, rej) => {
          const i = new Image();
          i.onload  = () => res(i);
          i.onerror = rej;
          i.src = 'eguitar2.jpg';
        });
        const bOff = document.createElement('canvas');
        bOff.width = CW; bOff.height = CH;
        const bc = bOff.getContext('2d');

        const scale = Math.min(CW / img.naturalWidth, CH / img.naturalHeight);
        const dw = img.naturalWidth  * scale;
        const dh = img.naturalHeight * scale;
        const dx = (CW - dw) / 2;
        const dy = (CH - dh) / 2;

        bc.fillStyle = '#888';
        bc.fillRect(0, 0, CW, CH);
        bc.drawImage(img, dx, dy, dw, dh);

        const { data } = bc.getImageData(0, 0, CW, CH);
        const pool = [];
        for (let y = 0; y < CH; y++) {
          for (let x = 0; x < CW; x++) {
            const idx = (y * CW + x) * 4;
            const r = data[idx], g = data[idx+1], b = data[idx+2];
            const isRed   = r > 155 && r > g * 2.0 && r > b * 2.0;
            const isBlack = Math.max(r, g, b) < 52;
            if (isRed || isBlack) pool.push(x, y);
          }
        }
        if (pool.length > 2000) {
          bodyPool   = pool;
          cx_canvas  = dx + dw / 2;
          cy_canvas  = dy + dh / 2;
          worldScale = 5.5 / Math.max(dw, dh);
        }
      } catch (_) { /* fallback below */ }

      // ── Fallback: hand-drawn Flying V ────────
      if (!bodyPool) {
        const bOff = document.createElement('canvas');
        bOff.width = CW; bOff.height = CH;
        const bc = bOff.getContext('2d');
        bc.fillStyle = 'white';

        bc.beginPath();
        bc.moveTo(cx,            CH*0.002);
        bc.lineTo(cx + CW*0.200, CH*0.055);
        bc.lineTo(cx + CW*0.140, CH*0.070);
        bc.lineTo(cx + CW*0.082, CH*0.092);
        bc.lineTo(cx - CW*0.082, CH*0.092);
        bc.lineTo(cx - CW*0.140, CH*0.070);
        bc.lineTo(cx - CW*0.200, CH*0.055);
        bc.closePath();
        bc.fill();
        for (const [px, py] of [
          [cx-CW*0.196, CH*0.022],[cx-CW*0.200, CH*0.042],[cx-CW*0.183, CH*0.061],
          [cx+CW*0.196, CH*0.022],[cx+CW*0.200, CH*0.042],[cx+CW*0.183, CH*0.061],
        ]) { bc.beginPath(); bc.arc(px, py, CW*0.040, 0, Math.PI*2); bc.fill(); }
        bc.fillRect(cx - CW*0.065, CH*0.092, CW*0.130, CH*0.007);

        bc.beginPath();
        bc.moveTo(cx - CW*0.056, CH*0.099);
        bc.lineTo(cx + CW*0.056, CH*0.099);
        bc.lineTo(cx + CW*0.073, CH*0.520);
        bc.lineTo(cx - CW*0.073, CH*0.520);
        bc.closePath();
        bc.fill();
        for (const fy of [CH*0.158,CH*0.200,CH*0.240,CH*0.276,CH*0.310,CH*0.353,CH*0.392,CH*0.424,CH*0.452]) {
          bc.beginPath(); bc.arc(cx, fy, CW*0.016, 0, Math.PI*2); bc.fill();
        }

        bc.beginPath();
        bc.moveTo(cx - CW*0.070, CH*0.520);
        bc.lineTo(cx + CW*0.070, CH*0.520);
        bc.lineTo(cx + CW*0.128, CH*0.552);
        bc.lineTo(cx + CW*0.490, CH*0.692);
        bc.lineTo(cx + CW*0.490, CH*0.742);
        bc.lineTo(cx + CW*0.096, CH*0.754);
        bc.lineTo(cx,            CH*0.924);
        bc.lineTo(cx - CW*0.096, CH*0.754);
        bc.lineTo(cx - CW*0.490, CH*0.742);
        bc.lineTo(cx - CW*0.490, CH*0.692);
        bc.lineTo(cx - CW*0.128, CH*0.552);
        bc.closePath();
        bc.fill();
        bc.fillRect(cx - CW*0.102, CH*0.592, CW*0.204, CH*0.021);
        bc.fillRect(cx - CW*0.102, CH*0.638, CW*0.204, CH*0.021);
        bc.fillRect(cx - CW*0.048, CH*0.682, CW*0.096, CH*0.014);

        const { data } = bc.getImageData(0, 0, CW, CH);
        bodyPool = [];
        for (let y = 0; y < CH; y++) {
          for (let x = 0; x < CW; x++) {
            const idx = (y * CW + x) * 4;
            if (data[idx+3] > 128 && data[idx] > 128) bodyPool.push(x, y);
          }
        }
      }

      const out = new Float32Array(count * 3);
      const len = bodyPool.length / 2;
      for (let i = 0; i < count; i++) {
        const p = Math.floor(Math.random() * len) * 2;
        const o = i * 3;
        out[o]   =  (bodyPool[p]   - cx_canvas) * worldScale;
        out[o+1] = -(bodyPool[p+1] - cy_canvas) * worldScale;
        out[o+2] =  (Math.random() - 0.5) * 0.10;
      }
      return out;
    }

    function buildScreenScatter(count) {
      const camDist = 5.0;
      const halfH = Math.tan((55 / 2) * Math.PI / 180) * camDist;
      const halfW = halfH * (window.innerWidth / window.innerHeight || 1.78);
      const out = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        out[i*3]   = (Math.random() - 0.5) * halfW * 2.2;
        out[i*3+1] = (Math.random() - 0.5) * halfH * 2.2;
        out[i*3+2] = (Math.random() - 0.5) * 1.2;
      }
      return out;
    }

    function scatter(count, radius) {
      const out = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi   = Math.acos(2 * Math.random() - 1);
        const r     = radius * (0.4 + Math.random() * 0.6);
        out[i*3]   = r * Math.sin(phi) * Math.cos(theta);
        out[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
        out[i*3+2] = r * Math.cos(phi);
      }
      return out;
    }

    function lerp3(a, b, dst, t) {
      const u = 1 - t;
      for (let i = 0; i < dst.length; i++) dst[i] = a[i] * u + b[i] * t;
    }

    function smoothstep(t) {
      t = Math.max(0, Math.min(1, t));
      return t * t * (3 - 2 * t);
    }

    function glowTexture() {
      const S = 128;
      const off = document.createElement('canvas');
      off.width = S; off.height = S;
      const ctx = off.getContext('2d');
      const g = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
      g.addColorStop(0,    'rgba(255, 255, 240, 1.00)');
      g.addColorStop(0.15, 'rgba(255, 220, 100, 0.90)');
      g.addColorStop(0.45, 'rgba(200, 146,  42, 0.45)');
      g.addColorStop(1,    'rgba(160,  80,  20, 0.00)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, S, S);
      return new THREE.CanvasTexture(off);
    }

    // ─────────────────────────────────────────
    //  ASYNC INIT
    // ─────────────────────────────────────────
    (async () => {

      const stateS     = buildScreenScatter(N_GUITAR);
      const guitarBase = await buildGuitarPositions(N_GUITAR);
      const stateA     = rotate(guitarBase, -0.78, -0.28,  0.30); // bridge POV
      const stateB     = rotate(guitarBase,  0.05,  0.15, -0.07); // guitar-store upright
      const stateD     = scatter(N_GUITAR, 9.0);                   // explosion
      const ROT_RX = 0.05, ROT_RY = 0.15, ROT_RZ = -0.07;

      // Ambient floating particles
      const ambientBase  = buildScreenScatter(N_AMBIENT);
      const ambientPhase = new Float32Array(N_AMBIENT);
      for (let i = 0; i < N_AMBIENT; i++) ambientPhase[i] = Math.random() * Math.PI * 2;

      // ── Three.js ──────────────────────────
      const canvas   = document.getElementById('particle-canvas');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(BG, 1);

      const scene  = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 100);
      camera.position.z = 5.0;

      // posAttr covers all N: N_GUITAR + N_AMBIENT
      const initPos = new Float32Array(N * 3);
      initPos.set(stateS);
      initPos.set(ambientBase, N_GUITAR * 3);

      const geometry = new THREE.BufferGeometry();
      const posAttr  = new THREE.BufferAttribute(initPos, 3);
      posAttr.setUsage(THREE.DynamicDrawUsage);
      geometry.setAttribute('position', posAttr);

      const material = new THREE.PointsMaterial({
        size: 0.10, map: glowTexture(), color: new THREE.Color(AMBER),
        transparent: true, depthWrite: false,
        blending: THREE.AdditiveBlending, sizeAttenuation: true,
      });
      scene.add(new THREE.Points(geometry, material));

      function onResize() {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      onResize();
      window.addEventListener('resize', onResize);

      const wigglePhase = new Float32Array(N_GUITAR);
      for (let i = 0; i < N_GUITAR; i++) wigglePhase[i] = Math.random() * Math.PI * 2;

      const basePos = new Float32Array(stateS);
      const proxy   = { phase: 0 };

      // ── Scroll sequence ────────────────────
      //  phase 0→1  0%–15%   scatter → bridge POV
      //  phase 1→2  15%–23%  linear pivot → guitar-store upright
      //  phase 2→3  23%–78%  360° Y rotation (6.545°/1% scroll)
      //  phase 3→4  78%–100% explosion
      function updateBase() {
        const p = proxy.phase;
        if (p <= 1) {
          lerp3(stateS, stateA, basePos, smoothstep(p));
        } else if (p <= 2) {
          const t = p - 1;
          rotateInto(guitarBase,
            -0.78 + 0.83 * t,
            -0.28 + 0.43 * t,
             0.30 - 0.37 * t,
            basePos);
        } else if (p <= 3) {
          rotateInto(guitarBase, ROT_RX, ROT_RY + (p - 2) * Math.PI * 2, ROT_RZ, basePos);
        } else {
          lerp3(stateB, stateD, basePos, smoothstep(Math.min(p - 3, 1)));
        }
      }

      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: '#scroll-container',
          start:   'top top',
          end:     'bottom bottom',
          scrub:   0.6,
        },
        onUpdate: updateBase,
      });

      tl.to(proxy, { phase: 1, duration: 0.15, ease: 'power2.out' }); // 0%–15%
      tl.to(proxy, { phase: 2, duration: 0.08, ease: 'none'       }); // 15%–23%
      tl.to(proxy, { phase: 3, duration: 0.55, ease: 'none'       }); // 23%–78%
      tl.to(proxy, { phase: 4, duration: 0.22, ease: 'power3.in'  }); // 78%–100%

      // ── Phase labels ──────────────────────
      gsap.timeline({
        scrollTrigger: {
          trigger: '#scroll-container',
          start:   'top top',
          end:     'bottom bottom',
          scrub:   1,
        }
      })
      .to('#label-a', { opacity: 0,   duration: 0.04 }, 0.11)
      .to('#sub-a',   { opacity: 0,   duration: 0.04 }, 0.11)
      .to('#label-b', { opacity: 1,   duration: 0.04 }, 0.16)
      .to('#label-b', { opacity: 0,   duration: 0.04 }, 0.22)
      .to('#label-c', { opacity: 1,   duration: 0.04 }, 0.25)
      .to('#label-c', { opacity: 0,   duration: 0.04 }, 0.76)
      .to('#label-d', { opacity: 1,   duration: 0.06 }, 0.80)
      .to('#sub-d',   { opacity: 0.7, duration: 0.06 }, 0.85);

      // ── Render loop ───────────────────────
      let clock = 0;
      (function animate() {
        requestAnimationFrame(animate);
        clock += 0.004;
        const p        = proxy.phase;
        const exploding = p > 3 ? smoothstep(p - 3) : 0;
        const wiggleAmt = 0.006 + exploding * 0.08;
        const pos       = posAttr.array;

        // Guitar particles
        for (let i = 0; i < N_GUITAR; i++) {
          const w = Math.sin(clock * 1.8 + wigglePhase[i]) * wiggleAmt;
          pos[i*3]   = basePos[i*3]   + w;
          pos[i*3+1] = basePos[i*3+1] + w * 0.6;
          pos[i*3+2] = basePos[i*3+2] + w * 0.4;
        }

        // Ambient floating particles
        const drift = 0.28 + exploding * 2.2;
        for (let i = 0; i < N_AMBIENT; i++) {
          const gi = N_GUITAR + i;
          const ap = ambientPhase[i];
          pos[gi*3]   = ambientBase[i*3]   + Math.sin(clock * 0.5  + ap)        * drift;
          pos[gi*3+1] = ambientBase[i*3+1] + Math.cos(clock * 0.38 + ap * 1.2)  * drift;
          pos[gi*3+2] = ambientBase[i*3+2] + Math.sin(clock * 0.28 + ap * 0.75) * drift * 0.4;
        }

        posAttr.needsUpdate = true;
        renderer.render(scene, camera);
      })();

    })();
  </script>
</body>
</html>
